<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компилятор приключений</title>
  <!-- Подключаем pdfmake для генерации PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .block { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #f9f9f9; }
    .block input[type="text"] { width: 100%; margin-bottom: 5px; padding: 5px; font-size: 16px; }
    .block textarea { width: 100%; padding: 5px; font-size: 14px; resize: vertical; }
    .block button { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; margin-top: 5px; }
    .block button:hover { background: #c0392b; }
    .toolbar { margin: 15px 0; }
    .toolbar button { padding: 8px 15px; margin-right: 10px; cursor: pointer; }
    .doc-meta { margin-bottom: 20px; }
    .doc-meta label { display: block; margin-top: 10px; font-weight: bold; }
    .doc-meta input, .doc-meta textarea { width: 100%; padding: 5px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Компилятор приключений</h1>

  <div class="doc-meta">
    <label>Название приключения:</label>
    <input type="text" id="docTitle" value="Название приключения" placeholder="Введите название...">
    <label>Краткая информация (для титульного листа):</label>
    <textarea id="docInfo" rows="2" placeholder="Автор, дата, описание...">Краткое описание</textarea>
  </div>

  <div class="toolbar">
    <button onclick="addBlock('h1')">➕ Добавить заголовок</button>
    <button onclick="addBlock('h2')">➕ Добавить подзаголовок</button>
  </div>

  <div id="blocksContainer"></div>

  <div class="toolbar" style="margin-top: 30px;">
    <button onclick="exportWord()">📄 Выгрузить Word (.doc)</button>
    <button onclick="exportPDF()">📕 Выгрузить PDF</button>
  </div>

  <script>
    let blockId = 0;

    // Добавление блока
    function addBlock(type) {
      const container = document.getElementById('blocksContainer');
      const div = document.createElement('div');
      div.className = 'block';
      div.dataset.type = type;
      div.dataset.id = blockId++;
      div.innerHTML = `
        <input type="text" class="block-title" placeholder="${type === 'h1' ? 'Заголовок' : 'Подзаголовок'}">
        <textarea class="block-content" rows="5" placeholder="Текст... (переносы строк сохранятся как абзацы)"></textarea>
        <button onclick="this.parentElement.remove()">Удалить блок</button>
      `;
      container.appendChild(div);
    }

    // Сбор данных со страницы
    function collectData() {
      const title = document.getElementById('docTitle').value;
      const info = document.getElementById('docInfo').value;
      const blocks = [];
      document.querySelectorAll('#blocksContainer .block').forEach(div => {
        const type = div.dataset.type;
        const titleVal = div.querySelector('.block-title').value.trim();
        const content = div.querySelector('.block-content').value;
        blocks.push({ type, title: titleVal, content });
      });
      return { title, info, blocks };
    }

    // === Генерация Word (HTML-файл .doc) ===
    function exportWord() {
      const data = collectData();

      let html = `
        <html>
        <head>
          <meta charset="UTF-8">
          <style>
            body { font-family: 'Times New Roman', serif; margin: 2cm; }
            h1 { font-size: 24pt; margin-top: 30pt; }
            h2 { font-size: 18pt; margin-top: 20pt; }
            .title-page { text-align: center; margin-top: 150px; }
            .title-page h1 { font-size: 36pt; border: none; }
            .title-page p { font-size: 16pt; }
            .toc { margin-top: 50px; }
            .toc h2 { font-size: 22pt; border-bottom: 1px solid #000; padding-bottom: 5px; }
            .toc ul { list-style: none; padding-left: 0; }
            .toc li { margin-bottom: 8px; font-size: 14pt; }
            .content { margin-top: 50px; }
            p { margin: 5px 0; font-size: 12pt; text-align: justify; }
          </style>
        </head>
        <body>
          <div class="title-page">
            <h1>${data.title}</h1>
            <p>${data.info.replace(/\n/g, '<br>')}</p>
          </div>
          <div class="toc">
            <h2>Содержание</h2>
            <ul>
      `;

      // Оглавление: только заголовки (h1)
      data.blocks.forEach(block => {
        if (block.type === 'h1') {
          html += `<li>${block.title || '(без названия)'}</li>`;
        }
      });

      html += `
            </ul>
          </div>
          <div class="content">
      `;

      // Содержимое
      data.blocks.forEach(block => {
        if (block.type === 'h1') {
          html += `<h1>${block.title || '(без названия)'}</h1>`;
        } else {
          html += `<h2>${block.title || '(без названия)'}</h2>`;
        }
        // Разбиваем текст на абзацы
        const paragraphs = block.content.split('\n').filter(p => p.trim() !== '');
        paragraphs.forEach(p => {
          html += `<p>${p}</p>`;
        });
      });

      html += `
          </div>
        </body>
        </html>
      `;

      const blob = new Blob([html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.doc';
      a.click();
      URL.revokeObjectURL(url);
    }

    // === Генерация PDF через pdfmake ===
    function exportPDF() {
      const data = collectData();

      // Формируем content для pdfmake
      const content = [];

      // 1. Титульный лист
      content.push({ text: data.title, style: 'title', alignment: 'center', margin: [0, 120, 0, 20] });
      content.push({ text: data.info, style: 'subtitle', alignment: 'center' });
      content.push({ text: '', pageBreak: 'after' }); // разрыв страницы

      // 2. Оглавление (автоматическое)
      content.push({
        toc: {
          title: { text: 'Содержание', style: 'header' }
        }
      });

      // 3. Содержимое
      data.blocks.forEach(block => {
        if (block.type === 'h1') {
          // Для заголовков включаем tocItem, чтобы они попали в оглавление
          content.push({ text: block.title || '(без названия)', style: 'header', tocItem: true });
        } else {
          content.push({ text: block.title || '(без названия)', style: 'subheader' });
        }
        // Текст разбиваем на параграфы
        const paragraphs = block.content.split('\n').filter(p => p.trim() !== '');
        paragraphs.forEach(p => {
          content.push({ text: p, style: 'paragraph' });
        });
      });

      const docDefinition = {
        pageSize: 'A4',
        pageMargins: [40, 60, 40, 60],
        footer: function(currentPage, pageCount) {
          // Нумерация: титульный лист (currentPage === 1) без номера, остальные — currentPage
          if (currentPage === 1) return '';
          return { text: currentPage.toString(), alignment: 'center', margin: [0, 10, 0, 0] };
        },
        content: content,
        styles: {
          title: { fontSize: 28, bold: true },
          subtitle: { fontSize: 16, italics: true },
          header: { fontSize: 20, bold: true, margin: [0, 20, 0, 10] },
          subheader: { fontSize: 16, bold: true, margin: [0, 15, 0, 5] },
          paragraph: { fontSize: 12, margin: [0, 5, 0, 5] }
        }
      };

      pdfMake.createPdf(docDefinition).download('document.pdf');
    }
  </script>
</body>
</html>
